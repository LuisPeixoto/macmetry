name: Release

# Push a tag such as `v0.1.0` to build installers and create a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple silicon, os: macos-latest, rust-target: aarch64-apple-darwin }
          - { name: Intel, os: macos-15-intel, rust-target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      # Signing is optional: the installers are signed only when the secrets exist (see docs/distribution.md).
      - name: Turn on macOS signing and notarization
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple signing secrets; the installer will not be signed"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          echo "::notice::macOS signing is on"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: macmetry ${{ github.ref_name }}
          releaseBody: See the [changelog](https://github.com/LuisPeixoto/macmetry/blob/main/CHANGELOG.md) for what is new.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

  cli:
    name: Command line (${{ matrix.target }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p macmetry-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="macmetry-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/macmetry" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  checksums:
    name: Checksums
    needs: [desktop, cli]
    runs-on: macos-latest
    steps:
      - name: Publish SHA256SUMS for every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && rm -f SHA256SUMS && shasum -a 256 * > ../SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
